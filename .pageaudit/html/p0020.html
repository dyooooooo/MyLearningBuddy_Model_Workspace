<section class="lb-main" data-zone="main"><div class="lb-block" data-block-id="b1" data-anchor="b1"><figure class="lb-fig-item" data-figure-group="b1"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b1.jpg" alt="1.2 常用逻辑用语"><figcaption>1.2 常用逻辑用语</figcaption></figure></div><div class="lb-block" data-block-id="b2" data-anchor="b2"><figure class="lb-fig-item" data-figure-group="b2"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b2.jpg" alt="1 命题"><figcaption>1 命题</figcaption></figure></div><div class="lb-block" data-block-id="b3" data-anchor="b3"><figure class="lb-fig-item" data-figure-group="b3"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b3.jpg" alt="在初中时已经知道，用自然语言、符号或式子表达，且可以判断其真假的语句叫做命题(proposition). 命题通常用陈述句表述. 其含义判断为真的命题叫做真命题，判断为假的命题叫做假命题. 例如，“4 能被 2 整除”是真命题，“3 能被 2 整除”是假命题."><figcaption>在初中时已经知道，用自然语言、符号或式子表达，且可以判断其真假的语句叫做命题(proposition). 命题通常用陈述句表述. 其含义判断为真的命题叫做真命题，判断为假的命题叫做假命题. 例如，“4 能被 2 整除”是真命题，“3 能被 2 整除”是假命题.</figcaption></figure></div><div class="lb-block" data-block-id="b4" data-anchor="b4"><figure class="lb-fig-item" data-figure-group="b4"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b4.jpg" alt="例 1 下列语句哪些是命题？如果是命题，那么它们是真命题还是假命题？为什么？"><figcaption>例 1 下列语句哪些是命题？如果是命题，那么它们是真命题还是假命题？为什么？</figcaption></figure></div><div class="lb-block" data-block-id="b5" data-anchor="b5"><figure class="lb-fig-item" data-figure-group="b5"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b5.jpg" alt="(1) 个位数字是 5 的自然数能被 5 整除;
(2) 凡直角三角形都相似;
(3) 请起立;
(4) 若两个角互为补角，则这两个角不相等;
(5) 若两个三角形的三组对应边相等，则这两个三角形全等;
(6) 你是高一学生吗?
(7) $x&gt;3$."><figcaption>(1) 个位数字是 5 的自然数能被 5 整除;
(2) 凡直角三角形都相似;
(3) 请起立;
(4) 若两个角互为补角，则这两个角不相等;
(5) 若两个三角形的三组对应边相等，则这两个三角形全等;
(6) 你是高一学生吗?
(7) $x&gt;3$.</figcaption></figure></div><div class="lb-block" data-block-id="b6" data-anchor="b6"><figure class="lb-fig-item" data-figure-group="b6"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b6.jpg" alt="解 语句(3)(6)(7)不是命题；语句(1)(2)(4)(5)是命题，其中语句(1)(5)是真命题，语句(2)(4)是假命题."><figcaption>解 语句(3)(6)(7)不是命题；语句(1)(2)(4)(5)是命题，其中语句(1)(5)是真命题，语句(2)(4)是假命题.</figcaption></figure></div><div class="lb-block" data-block-id="b7" data-anchor="b7"><figure class="lb-fig-item" data-figure-group="b7"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b7.jpg" alt="(1) 这是一个真命题. 因为个位数字是 5 的自然数可写成 $10k+5$ 的形式($k \in \mathbf{N}$)，而 $10k+5=5(2k+1)$，它总能被 5 整除，所以个位数字是 5 的自然数能被 5 整除."><figcaption>(1) 这是一个真命题. 因为个位数字是 5 的自然数可写成 $10k+5$ 的形式($k \in \mathbf{N}$)，而 $10k+5=5(2k+1)$，它总能被 5 整除，所以个位数字是 5 的自然数能被 5 整除.</figcaption></figure></div><div class="lb-block" data-block-id="b8" data-anchor="b8"><figure class="lb-fig-item" data-figure-group="b8"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b8.jpg" alt="(2) 因为三个角分别为 $90^\circ$、$45^\circ$、$45^\circ$ 的直角三角形与三个角分别为 $90^\circ$、$60^\circ$、$30^\circ$ 的直角三角形是不相似的，所以“凡直角三角形都相似”是一个假命题."><figcaption>(2) 因为三个角分别为 $90^\circ$、$45^\circ$、$45^\circ$ 的直角三角形与三个角分别为 $90^\circ$、$60^\circ$、$30^\circ$ 的直角三角形是不相似的，所以“凡直角三角形都相似”是一个假命题.</figcaption></figure></div><div class="lb-block" data-block-id="b9" data-anchor="b9"><figure class="lb-fig-item" data-figure-group="b9"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b9.jpg" alt="(3) “请起立”无法判定真假，它不是一个命题."><figcaption>(3) “请起立”无法判定真假，它不是一个命题.</figcaption></figure></div><div class="lb-block" data-block-id="b10" data-anchor="b10"><figure class="lb-fig-item" data-figure-group="b10"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b10.jpg" alt="(4) 取一个角为 $90^\circ$，另一个角也为 $90^\circ$，它们是互补的，同时它们也是相等的，所以“若两个角互为补角，则这两个角不相等”是一个假命题."><figcaption>(4) 取一个角为 $90^\circ$，另一个角也为 $90^\circ$，它们是互补的，同时它们也是相等的，所以“若两个角互为补角，则这两个角不相等”是一个假命题.</figcaption></figure></div><div class="lb-block" data-block-id="b11" data-anchor="b11"><figure class="lb-fig-item" data-figure-group="b11"><img src="/api/v1/admin/import35b/asset?key=import35b%2Ff71290dc644440e99584733d2362bee1%2Fassets%2F35b%2Ffigures%2Fp0020_b11.jpg" alt="13"><figcaption>13</figcaption></figure></div></section>
