<section class="lb-main" data-zone="main"><div class="lb-block" data-block-id="p30_b1"><figure class="lb-fig-item" data-figure-group="p30_f1"><img src="/api/v1/admin/import35b/asset?key=import35b%2F7b33d74bc3d042a0b9836116f8cc3bdf%2Fassets%2F35b%2Ffigures%2Fp0030_p30_b1.jpg" alt="第 2 章"><figcaption>第 2 章</figcaption></figure></div><div class="lb-block" data-block-id="p30_b3"><p>数量关系是数学重要的研究对象，相等关系与不等关系是最基本的数量关系，而等式与不等式则是表示相应数量关系的基本工具。等式与不等式的知识，在日常生活中也有着广泛的应用。</p></div><div class="lb-block" data-block-id="p30_b2"><p>等式</p><p>与不等式</p></div><div class="lb-block" data-block-id="p30_b4"><p>我们将通过类比方法，学习有关等式与不等式的性质，并借助集合和逻辑的语言，求解和证明一些基本的不等式。求解不等式通常有两种方法，一种是代数方法，另一种是用函数观点求解。在本章中，我们采用代数方法求解不等式，而用函数观点求解将在后续章节加以学习。在学习过程中，要注意等式与不等式之间的共性和差异，掌握等价变形的方法，并特别注意不等式取到等号的条件。</p></div></section>
