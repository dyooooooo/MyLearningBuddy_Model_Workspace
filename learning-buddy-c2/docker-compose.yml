services:
  vllm:
    container_name: vllm-qwen36-35b
    image: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
    entrypoint: ["vllm"]
    networks:
      - learning_buddy_c2
    gpus: all
    ipc: host
    shm_size: "16gb"
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ${MODELS_HOST_PATH:-/home/mylearningbuddy/opt/models}:/models:ro
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      VLLM_USE_FLASHINFER_MOE_FP4: ${VLLM_USE_FLASHINFER_MOE_FP4:-0}
      VLLM_NVFP4_GEMM_BACKEND: ${VLLM_NVFP4_GEMM_BACKEND:-marlin}
      VLLM_MARLIN_USE_ATOMIC_ADD: ${VLLM_MARLIN_USE_ATOMIC_ADD:-1}
      VLLM_TEST_FORCE_FP8_MARLIN: ${VLLM_TEST_FORCE_FP8_MARLIN:-0}
      FLASHINFER_DISABLE_VERSION_CHECK: ${FLASHINFER_DISABLE_VERSION_CHECK:-1}
      CUTE_DSL_ARCH: ${CUTE_DSL_ARCH:-sm_121a}
    command:
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "8088"
      - --model
      - /models/Qwen3.6-35B-A3B-NVFP4
      - --served-model-name
      - qwen36-35b-nvfp4
      - --quantization
      - modelopt
      - --moe-backend
      - marlin
      - --kv-cache-dtype
      - fp8
      - --attention-backend
      - flashinfer
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "8192"
      - --gpu-memory-utilization
      - "0.55"
      - --enable-prefix-caching
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      - --load-format
      - fastsafetensors
      - --trust-remote-code
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8088/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  c2-gateway:
    container_name: c2-gateway
    build:
      context: ../exam-ocr-server
      dockerfile: Dockerfile
    networks:
      - learning_buddy_c2
    depends_on:
      vllm:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - companion-data:/data/companion
    environment:
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm-qwen36-35b:8088/v1}
      VLLM_MODEL: ${VLLM_MODEL:-qwen36-35b-nvfp4}
      COMPANION_DATA_DIR: /data/companion
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  learning_buddy_c2:
    name: learning-buddy-c2
    driver: bridge

volumes:
  companion-data:
