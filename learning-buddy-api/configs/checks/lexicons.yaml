# 命名词表：一批「不属于某一本教材」的中文与符号数据，供表达式用
# lexicon('名字') 引用。
#
# 为什么单独一个文件：跨书守卫（corpus_symptoms 的 _cross_book_errors）禁止把正文
# 文字写死在表达式里，否则换一本书就失效。但排版惯例词、单位名、标点变体这类数据
# 本来就该集中成一份具名词表——它属于「中文数学教材的排版惯例」，不属于某一本书。
# 所以这个文件放行中文，代价是每份表必须有名字和 doc（中文释义）：说不清收的是
# 什么的表，没人敢往里加词。
#
# 规则：
#   - 名字小写下划线；doc 必填，写清「这份表收什么、不收什么」
#   - words 必须非空，每项都是字符串
#   - 引用侧只能写字面量：lexicon('math_markers')，不能 lexicon(变量)
#
# 改完保存即生效（bind-mount + mtime 指纹），不重建镜像、不重启服务。
# 当前可用清单看 GET /api/v1/admin/corpus/checks 的 vocabulary.lexicons。

lexicons:
  math_markers:
    doc: >
      行内/行间公式的排版标记。块里出现任意一个，就认为这块含公式。
      收的是标记本身，不收具体命令名（\sin、\log 这些不用列，它们必然伴随其他标记）。
    words:
      - '$'
      - '\('
      - '\['
      - '\begin{'
      - '\frac'
      - '\sqrt'

  math_label_words:
    doc: >
      LaTeX 公式里合法出现在 \text{…} 内的中文标签：推导对齐标签（原式/左边/右边）、
      证明用语、以及分段函数的条件连接词。这些是通行排版惯例，教材里到处都是，
      出现在公式里**不算错**。收的是标签与连接词，不收任何成句的正文——
      判据要认的正是「本该在公式外的正文被塞进了公式」。
    words:
      # 推导对齐标签
      - 原式
      - 左边
      - 右边
      - 上式
      - 下式
      - 原不等式
      - 原方程
      - 原函数
      # 证明与解答用语
      - 解
      - 证
      - 证明
      - 略
      - 答
      - 注
      - 综上
      - 于是
      - 显然
      - 同理
      # 连接词与条件词（分段函数、取值范围里常见）
      - 即
      - 得
      - 由
      - 故
      - 又
      - 所以
      - 因为
      - 其中
      - 设
      - 令
      - 当
      - 时
      - 且
      - 或
      - 反之
      - 类似地
